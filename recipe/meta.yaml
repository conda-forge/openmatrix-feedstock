{% set name = "openmatrix" %}
{% set version = "0.4.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d3779f4549ae7a1aae42d52ac1c9e2e7e2aa1f8a01899f88f6c46b1c6eaa68b6

build:
  number: 0
  noarch: python
  entry_points:
    - omx-validate = openmatrix.validator:command_line
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - numpy >=1.5.0
    - python >=3.6
    - pytables >=3.1.0

test:
  imports:
    - openmatrix
  commands:
    - pip check
    - omx-validate --help
  requires:
    - pip

about:
  home: https://github.com/osPlanning/omx
  summary: OMX, the open matrix data format
  license: Apache-2.0
  license_file: LICENSE.TXT

extra:
  recipe-maintainers:
    - jpn--
    - bstabler
